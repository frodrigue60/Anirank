version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: anirank_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: anirank_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set anirank-minio http://minio:9000 minioadmin miniopassword123;
      /usr/bin/mc mb anirank-minio/anirank-public --ignore-existing;
      /usr/bin/mc anonymous set public anirank-minio/anirank-public;
      exit 0;
      "

volumes:
  minio_data:

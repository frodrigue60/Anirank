basePath: /api
definitions:
  domain.AppError:
    properties:
      code:
        type: integer
      err: {}
      message:
        type: string
    type: object
  domain.Artist:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      name_jp:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.Badge:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Comment:
    properties:
      commentable_id:
        type: integer
      commentable_type:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      parent_id:
        type: integer
      replies:
        items:
          $ref: '#/definitions/domain.Comment'
        type: array
      replies_count:
        type: integer
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: Relational Output Data
      user_id:
        type: integer
    type: object
  domain.ExternalLink:
    properties:
      created_at:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  domain.Format:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.Genre:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.Playlist:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_public:
        type: boolean
      name:
        type: string
      songs:
        items:
          $ref: '#/definitions/domain.PlaylistSong'
        type: array
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: Relationships
      user_id:
        type: integer
    type: object
  domain.PlaylistSong:
    properties:
      playlist_id:
        type: integer
      position:
        type: integer
      song:
        allOf:
        - $ref: '#/definitions/domain.Song'
        description: Enriched
      song_id:
        type: integer
    type: object
  domain.Post:
    properties:
      anilist_id:
        type: integer
      banner:
        type: string
      banner_src:
        type: string
      created_at:
        type: string
      description:
        type: string
      external_links:
        items:
          $ref: '#/definitions/domain.ExternalLink'
        type: array
      format:
        $ref: '#/definitions/domain.Format'
      format_id:
        type: integer
      genres:
        items:
          $ref: '#/definitions/domain.Genre'
        type: array
      id:
        type: integer
      producers:
        items:
          $ref: '#/definitions/domain.Producer'
        type: array
      season:
        $ref: '#/definitions/domain.Season'
      season_id:
        type: integer
      slug:
        type: string
      songs:
        items:
          $ref: '#/definitions/domain.Song'
        type: array
      status:
        type: boolean
      studios:
        items:
          $ref: '#/definitions/domain.Studio'
        type: array
      thumbnail:
        type: string
      thumbnail_src:
        type: string
      title:
        type: string
      updated_at:
        type: string
      year:
        allOf:
        - $ref: '#/definitions/domain.Year'
        description: Relations
      year_id:
        type: integer
    type: object
  domain.Producer:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.Report:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      song:
        allOf:
        - $ref: '#/definitions/domain.Song'
        description: Relational
      song_id:
        type: integer
      source:
        description: E.g., 'web', 'app', 'ext'
        type: string
      status:
        description: '''pending'', ''fixed'''
        type: string
      title:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/domain.User'
      user_id:
        type: integer
    type: object
  domain.Role:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.Season:
    properties:
      created_at:
        type: string
      current:
        type: boolean
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Song:
    properties:
      anime_id:
        type: integer
      artists:
        items:
          $ref: '#/definitions/domain.Artist'
        type: array
      created_at:
        type: string
      id:
        type: integer
      post:
        allOf:
        - $ref: '#/definitions/domain.Post'
        description: Relations
      season:
        $ref: '#/definitions/domain.Season'
      season_id:
        type: integer
      slug:
        type: string
      song_en:
        type: string
      song_jp:
        type: string
      song_romaji:
        type: string
      theme_num:
        type: string
      type:
        type: string
      updated_at:
        type: string
      variants:
        items:
          $ref: '#/definitions/domain.SongVariant'
        type: array
      views:
        type: integer
      year:
        $ref: '#/definitions/domain.Year'
      year_id:
        type: integer
    type: object
  domain.SongVariant:
    properties:
      created_at:
        type: string
      id:
        type: integer
      season:
        $ref: '#/definitions/domain.Season'
      season_id:
        type: integer
      slug:
        type: string
      song:
        allOf:
        - $ref: '#/definitions/domain.Song'
        description: Relations
      song_id:
        type: integer
      spoiler:
        type: boolean
      updated_at:
        type: string
      version_number:
        type: integer
      video_src:
        description: Embedded Video Info to simulate 1:1 legacy relation without join
          overhead
        type: string
      video_type:
        description: file
        type: string
      views:
        type: integer
      year:
        $ref: '#/definitions/domain.Year'
      year_id:
        type: integer
    type: object
  domain.Studio:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  domain.Tournament:
    properties:
      created_at:
        type: string
      current_round:
        type: integer
      description:
        type: string
      id:
        type: integer
      matchups:
        description: Tree of matchups
        items:
          $ref: '#/definitions/domain.TournamentMatchup'
        type: array
      name:
        type: string
      slug:
        type: string
      status:
        description: draft, active, completed
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  domain.TournamentMatchup:
    properties:
      created_at:
        type: string
      id:
        type: integer
      matchup_order:
        type: integer
      round:
        type: integer
      song_a:
        allOf:
        - $ref: '#/definitions/domain.Song'
        description: Relations
      song_a_id:
        type: integer
      song_b:
        $ref: '#/definitions/domain.Song'
      song_b_id:
        description: Nulable if waiting or got a bye
        type: integer
      status:
        description: pending, active, completed
        type: string
      tournament_id:
        type: integer
      updated_at:
        type: string
      winner:
        $ref: '#/definitions/domain.Song'
      winner_id:
        type: integer
    type: object
  domain.User:
    properties:
      badges:
        items:
          $ref: '#/definitions/domain.Badge'
        type: array
      banner:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      roles:
        description: RBAC Relations
        items:
          $ref: '#/definitions/domain.Role'
        type: array
      score_format:
        type: string
      slug:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  domain.UserRequest:
    properties:
      attended_admin:
        $ref: '#/definitions/domain.User'
      attended_by:
        description: nullable
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      status:
        description: '''pending'', ''attended'''
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/domain.User'
        description: Relational
      user_id:
        type: integer
    type: object
  domain.Year:
    properties:
      created_at:
        type: string
      current:
        type: boolean
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: admin@anirank.com
    name: Soporte API Anirank
  description: API Rest interactiva y pública para el proyecto Anirank.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Anirank API
  version: "1.0"
paths:
  /admin/animes:
    post:
      consumes:
      - application/json
      description: Create a new Anime (Post) in the database.
      parameters:
      - description: Anime Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Post'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/domain.Post'
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.AppError'
      security:
      - BearerAuth: []
      summary: Create Anime
      tags:
      - Admin Animes
  /admin/animes/{id}:
    delete:
      description: Delete an existing Anime by ID.
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.AppError'
      security:
      - BearerAuth: []
      summary: Delete Anime
      tags:
      - Admin Animes
    put:
      consumes:
      - application/json
      description: Update an existing Anime by ID.
      parameters:
      - description: Anime ID
        in: path
        name: id
        required: true
        type: integer
      - description: Anime Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Post'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/domain.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.AppError'
      security:
      - BearerAuth: []
      summary: Update Anime
      tags:
      - Admin Animes
  /admin/artists:
    post:
      consumes:
      - application/json
      description: Create a new Artist in the database.
      parameters:
      - description: Artist Data
        in: body

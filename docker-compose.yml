services:
  # --- DATABASE ---
  db:
    image: postgres:15-alpine
    container_name: anirank_db
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --- CACHE ---
  redis:
    image: redis:7-alpine
    container_name: anirank_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- STORAGE (MINIO) ---
  minio:
    image: minio/minio
    container_name: anirank_minio
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
  
  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin admin123;
      /usr/bin/mc mb myminio/anirank || true;
      /usr/bin/mc anonymous set public myminio/anirank;
      exit 0;
      "

  # --- BACKEND ---
  backend:
    build:
      context: ./backend
    container_name: anirank_backend
    restart: always
    depends_on:
      - db
      - redis
      - minio
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_USE_SSL: "false"
    ports:
      - "8080:8080"

  # --- FRONTEND ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: anirank_frontend
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:

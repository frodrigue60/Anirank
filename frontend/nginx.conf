server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # DNS resolver for dynamic service discovery
    # 127.0.0.11 is Docker, 8.8.8.8 is fallback
    resolver 127.0.0.11 8.8.8.8 valid=30s;

    # Define backend upstream as a variable to prevent startup crashes if service is not ready
    set $backend_url "http://backend:8080";

    # API requests always go directly to the backend
    location /api/ {
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fix for Fiber CSRF "referer invalid" when using subdomains
        proxy_set_header Referer $backend_url;
    }

    # Redirect /sitemap.xml to the backend
    location = /sitemap.xml {
        proxy_pass $backend_url/api/catalog/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routes: detect bots and serve SEO metadata
    location / {
        if ($http_user_agent ~* (Discordbot|Twitterbot|WhatsApp|facebookexternalhit|TelegramBot|Slackbot|Googlebot|bingbot|Baiduspider|YandexBot|LinkedInBot|Embedly|quora\ link\ preview|showyoubot|outbrain|pinterest\/0\.|pinterestbot|redditbot|applebot|flipboard|tumblr|bitlybot|SkypeUriPreview|nuzzel|google-adwords-instant|orcidbot|headlesschrome|google-structured-data-testing-tool|google-indexing-proxy|OrcaScan|Site-Inspector|Twitter\ Bot|validator)) {
            proxy_pass $backend_url/seo-bot$request_uri;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Cache Control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

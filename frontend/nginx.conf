server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Use Railway internal network for backend communication.
    # We use literal strings in proxy_pass to avoid needing a resolver for variables.
    
    # API requests
    location /api/ {
        proxy_pass http://backend.railway.internal:8080/api/;
        proxy_set_header Host api.anirank.work;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer https://api.anirank.work;
    }

    # Redirect /sitemap.xml to the backend
    location = /sitemap.xml {
        proxy_pass http://backend.railway.internal:8080/api/catalog/sitemap.xml;
        proxy_set_header Host api.anirank.work;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Sitemaps can be slow to generate
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SPA routes: detect bots and serve SEO metadata
    location / {
        if ($http_user_agent ~* (Discordbot|Twitterbot|WhatsApp|facebookexternalhit|TelegramBot|Slackbot|Googlebot|bingbot|Baiduspider|YandexBot|LinkedInBot|Embedly|quora\ link\ preview|showyoubot|outbrain|pinterest\/0\.|pinterestbot|redditbot|applebot|flipboard|tumblr|bitlybot|SkypeUriPreview|nuzzel|google-adwords-instant|orcidbot|headlesschrome|google-structured-data-testing-tool|google-indexing-proxy|OrcaScan|Site-Inspector|Twitter\ Bot|validator)) {
            proxy_pass http://backend.railway.internal:8080/seo-bot$request_uri;
            break;
        }
        try_files $uri $uri/ /index.html;
    }
        try_files $uri $uri/ /index.html;
    }

    # Cache Control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

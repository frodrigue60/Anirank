server {
    listen 80;
    server_name localhost;

    client_max_body_size 256M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Use Railway internal DNS (127.0.0.11 is common in Docker/Railway)
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # Define backend URL as a variable to prevent Nginx from failing at startup 
    # if the hostname isn't immediately resolvable.
    set $backend_url "http://backend.railway.internal:8080";

    # API requests
    location /api/ {
        proxy_pass $backend_url/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host api.anirank.work;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer https://api.anirank.work;
    }


    # SPA routes: detect bots and serve SEO metadata
    location / {
        if ($http_user_agent ~* (Discordbot|Twitterbot|WhatsApp|facebookexternalhit|TelegramBot|Slackbot|Googlebot|bingbot|Baiduspider|YandexBot|LinkedInBot|Embedly|quora\ link\ preview|showyoubot|outbrain|pinterest\/0\.|pinterestbot|redditbot|applebot|flipboard|tumblr|bitlybot|SkypeUriPreview|nuzzel|google-adwords-instant|orcidbot|headlesschrome|google-structured-data-testing-tool|google-indexing-proxy|OrcaScan|Site-Inspector|Twitter\ Bot|validator)) {
            proxy_pass $backend_url/seo-bot$request_uri;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Cache Control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

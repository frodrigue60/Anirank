server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Use a standard resolver (Cloudflare/Google) - IPv6 disabled to avoid network unreachable errors
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
    resolver_timeout 5s;

    # SSL configuration for upstreams (Cloudflare requires SNI)
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # Define backend URL and Host
    set $backend_url "https://api.anirank.work";
    set $backend_host "api.anirank.work";

    # API requests always go directly to the backend
    location /api/ {
        proxy_pass $backend_url;
        proxy_set_header Host $backend_host;
        proxy_ssl_name $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fix for Fiber CSRF "referer invalid" when using subdomains
        proxy_set_header Referer $backend_url;
    }

    # Redirect /sitemap.xml to the backend
    location = /sitemap.xml {
        proxy_pass $backend_url/api/catalog/sitemap.xml;
        proxy_set_header Host $backend_host;
        proxy_ssl_name $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Sitemaps can be slow to generate
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SPA routes: detect bots and serve SEO metadata
    location / {
        if ($http_user_agent ~* (Discordbot|Twitterbot|WhatsApp|facebookexternalhit|TelegramBot|Slackbot|Googlebot|bingbot|Baiduspider|YandexBot|LinkedInBot|Embedly|quora\ link\ preview|showyoubot|outbrain|pinterest\/0\.|pinterestbot|redditbot|applebot|flipboard|tumblr|bitlybot|SkypeUriPreview|nuzzel|google-adwords-instant|orcidbot|headlesschrome|google-structured-data-testing-tool|google-indexing-proxy|OrcaScan|Site-Inspector|Twitter\ Bot|validator)) {
            proxy_pass $backend_url/seo-bot$request_uri;
            proxy_set_header Host $backend_host;
            proxy_ssl_name $backend_host;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Cache Control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

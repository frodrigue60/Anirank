server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker DNS resolver
    resolver 127.0.0.11;

    # API requests always go directly to the backend (no bot interception)
    # This is critical: bots fetch og:image URLs like /api/og/home
    # If we intercept those, they get HTML instead of the PNG image
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect /sitemap.xml to the backend
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/catalog/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routes: detect bots and serve SEO metadata
    location / {
        if ($http_user_agent ~* (Discordbot|Twitterbot|WhatsApp|facebookexternalhit|TelegramBot|Slackbot|Googlebot|bingbot|Baiduspider|YandexBot|LinkedInBot|Embedly|quora\ link\ preview|showyoubot|outbrain|pinterest\/0\.|pinterestbot|redditbot|applebot|flipboard|tumblr|bitlybot|SkypeUriPreview|nuzzel|google-adwords-instant|orcidbot|headlesschrome|google-structured-data-testing-tool|google-indexing-proxy|OrcaScan|Site-Inspector|Twitter\ Bot|validator)) {
            proxy_pass http://backend:8080/seo-bot$request_uri;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Cache Control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
